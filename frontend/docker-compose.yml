version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: recuright_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recuright
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: recuright_redis
    restart: always
    ports:
      - "6379:6379"


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recuright_api
    restart: always
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/recuright?schema=public
      JWT_SECRET: supersecretjwtkey
    command: ["./wait-for.sh", "postgres:5432", "--", "npm", "run", "start:prod"]

volumes:
  postgres_data:
